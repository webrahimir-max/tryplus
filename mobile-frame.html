<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRYPLUS — live site in a mobile browser frame (webrahimir-max.github.io/tryplus)</title>
<style>
  :root { --frame-w: 600px; --screen-h: 780px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 26px 16px;
    background: radial-gradient(1400px 800px at 50% 0%, #1b2330 0%, #0b0f16 60%, #070a10 100%);
    font-family: "Segoe UI", Roboto, "Vazirmatn", Tahoma, Arial, sans-serif; color: #e8edf5;
  }
  .phone {
    width: calc(var(--frame-w) + 28px); padding: 14px; border-radius: 52px;
    background: linear-gradient(180deg, #2b3340 0%, #14181f 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 0 0 2px #3d4658;
  }
  .screen { width: var(--frame-w); border-radius: 40px; overflow: hidden; background: #fff; }
  .chrome-top { background: #202124; color: #e8eaed; padding: 14px 16px 16px; }
  .chrome-row { display: flex; align-items: center; gap: 14px; }
  .dots { display: flex; gap: 4px; flex: 0 0 auto; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #9aa0a6; display: block; }
  .url-pill {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: #303134; border-radius: 26px; padding: 13px 18px;
    font-size: 20px; line-height: 1.2; letter-spacing: .3px; color: #f1f3f4; white-space: nowrap;
  }
  .lock { width: 18px; height: 18px; flex: 0 0 18px; }
  .url-pill .scheme { color: #9aa0a6; }
  .url-pill .host { color: #ffffff; font-weight: 700; }
  .url-pill .path { color: #dadce0; }
  .refresh { color: #9aa0a6; font-size: 20px; flex: 0 0 auto; }
  .avatar { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; background: #8ab4f8;
    color: #202124; font-size: 14px; font-weight: 700; display: grid; place-items: center; }
  iframe { display: block; width: var(--frame-w); height: var(--screen-h); border: 0; background: #fff; }
  .chrome-bottom { background: #202124; color: #9aa0a6; display: flex; justify-content: space-around;
    padding: 14px 0 18px; font-size: 22px; }
  .caption { text-align: center; font-size: 17px; color: #aab6c8; max-width: 640px; line-height: 1.6; }
  .caption b { color: #e8edf5; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="chrome-top">
        <div class="chrome-row">
          <span class="dots"><i></i><i></i><i></i><i></i></span>
          <span class="url-pill">
            <svg class="lock" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#8ab4f8" stroke-width="2"/><rect x="5" y="10" width="14" height="10" rx="2" fill="#8ab4f8"/></svg>
            <span><span class="scheme">https://</span><span class="host">webrahimir-max.github.io</span><span class="path">/tryplus/</span></span>
          </span>
          <span class="refresh">&#10227;</span>
          <span class="avatar">W</span>
        </div>
      </div>
      <iframe src="https://webrahimir-max.github.io/tryplus/" title="TRYPLUS live site"></iframe>
      <div class="chrome-bottom"><span>&#9664;</span><span>&#9711;</span><span>&#9723;</span></div>
    </div>
  </div>
  <p class="caption">Live URL shown in the address bar: <b>webrahimir-max.github.io/tryplus</b> &mdash; GitHub Pages site of <b>github.com/webrahimir-max/tryplus</b></p>
</body>
</html>
